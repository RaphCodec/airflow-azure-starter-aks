name: 🚀 Deployment Issue
description: Report issues with Azure resource deployment or Airflow installation
title: "[DEPLOYMENT] "
labels: ["deployment", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Having trouble with deployment? Please provide details about your deployment issue to help us assist you.

  - type: dropdown
    id: deployment-stage
    attributes:
      label: Deployment Stage
      description: At which stage did the deployment fail?
      options:
        - AKS Cluster Setup
        - ACR Image Import
        - Helm Chart Installation
        - Airflow Pod Startup
        - Service Access
        - Other
    validations:
      required: true

  - type: dropdown
    id: azure-region
    attributes:
      label: Azure Region
      description: Which Azure region are you deploying to?
      options:
        - East US
        - East US 2
        - West US
        - West US 2
        - Central US
        - North Central US
        - South Central US
        - West Central US
        - Canada Central
        - Canada East
        - Europe West
        - Europe North
        - UK South
        - UK West
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe the deployment issue you're experiencing
      placeholder: When running the deployment, I encountered...
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Used
      description: What command were you running when the issue occurred?
      render: shell
      placeholder: |
        ./install-airflow.sh
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Please paste the full error output
      render: shell
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration Details
      description: Please share relevant configuration (remove sensitive data)
      render: yaml
      placeholder: |
        # vars.yml (sanitized)
        resource_group: "my-rg"
        location: "eastus2"
        kubernetes_version: "1.33.2"
        # etc.

  - type: textarea
    id: azure-resources
    attributes:
      label: Azure Resources Status
      description: If applicable, what's the status of your Azure resources?
      placeholder: |
        Resource Group: Created/Failed
        AKS Cluster: Running/Failed
        ACR: Available/Failed
        etc.

  - type: textarea
    id: troubleshooting
    attributes:
      label: Troubleshooting Attempted
      description: What troubleshooting steps have you already tried?
      placeholder: |
        - Verified Azure CLI authentication
        - Checked resource quotas
        - Reviewed Azure subscription permissions
        - etc.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      value: |
        - OS: [e.g., Ubuntu 20.04]
        - Azure CLI version: [run `az --version`]
        - Kubectl version: [run `kubectl version --client`]
        - Helm version: [run `helm version`]
        - Azure subscription type: [Free/Pay-as-you-go/Enterprise]
    validations:
      required: true