---
- name: Create Azure Data Lake Storage Gen2
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - ../../inventory/vars.yml
  tasks:
    - name: Create ADLS Gen2 Storage Account
      azure_rm_resource:
        resource_group: "{{ resource_group }}"
        provider: storage
        resource_type: storageAccounts
        resource_name: "{{ storage_account_name }}"
        api_version: "2023-01-01"
        body:
          location: "{{ location }}"
          sku:
            name: Standard_LRS
          kind: StorageV2
          properties:
            isHnsEnabled: true
          tags: "{{ tags }}"
        state: present
      register: adls_creation

    - name: Display ADLS Gen2 creation status
      debug:
        msg: |
          Azure Data Lake Storage Gen2 Creation Initiated!
          Storage Account Name: {{ storage_account_name }}
          Resource Group: {{ resource_group }}
          Location: {{ location }}
          SKU: Standard_LRS
          Kind: StorageV2
          Hierarchical Namespace: Enabled
          Provisioning State: {{ adls_creation.response.properties.provisioningState | default('N/A') }}
          
          Verify creation with:
          az storage account show --name {{ storage_account_name }} --resource-group {{ resource_group }}