- name: Create AKS Cluster
  azure.azcollection.azure_rm_aks:
    resource_group: airflow-rg
    name: airflow-aks
    dns_prefix: airflow
    location: eastus2
    kubernetes_version: "1.33.2"
    agent_pool_profiles:
      - name: default
        count: 4
        vm_size: Standard_B2s
        os_type: Linux
        mode: System # every cluster must have at least 1 system pool
    enable_rbac: true
    network_profile:
      network_plugin: azure
    state: present

- name: Display AKS cluster information
  debug:
    msg: |
      AKS Cluster Created Successfully!
      Cluster Name: airflow-aks
      Resource Group: airflow-rg
      Location: eastus2
      
      To connect to the cluster, run:
      az aks get-credentials --resource-group airflow-rg --name airflow-aks
      
      Then verify with:
      kubectl get nodes
