site_name: Airflow AKS Starter
site_author: RaphCodec
nav:
  - Home: index.md
theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  palette: 
    scheme: slate
    primary: indigo
    accent: deep purple
  
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - admonition
  - pymdownx.details