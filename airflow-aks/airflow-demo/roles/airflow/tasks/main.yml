- name: Add Apache Airflow Helm repo
  shell: |
    helm repo add apache-airflow https://airflow.apache.org
    helm repo update
  args:
    executable: /bin/bash
  register: helm_repo_add
  changed_when: "'has been added' in helm_repo_add.stdout or 'Update Complete' in helm_repo_add.stdout"

- name: Check if Airflow release exists in namespace
  shell: helm list -n airflow -o json | jq -r '.[] | select(.name=="airflow") | .name'
  args:
    executable: /bin/bash
  register: airflow_release_check
  changed_when: false
  failed_when: false

- name: Uninstall existing Airflow release
  shell: helm uninstall airflow -n {{ namespace }}
  args:
    executable: /bin/bash
  when: airflow_release_check.stdout == "airflow"
  register: helm_uninstall
  failed_when: false

- name: Wait for Airflow resources to be cleaned up
  shell: kubectl get pods -n airflow --no-headers 2>/dev/null | wc -l
  args:
    executable: /bin/bash
  register: pod_count
  until: pod_count.stdout | int == 0
  retries: 30
  delay: 10
  when: airflow_release_check.stdout == "airflow"
  failed_when: false

- name: Install Airflow with Helm using values file
  shell: |
    helm install airflow apache-airflow/airflow \
      --namespace {{ namespace }} \
      --create-namespace \
      --values {{ role_path }}/tasks/airflow-values.yaml \
      --wait \
      --timeout 10m \
      --debug
  args:
    executable: /bin/bash
  register: helm_install
  tags:
    - airflow

- name: Display Helm installation output
  debug:
    var: helm_install.stdout_lines
  when: helm_install.stdout_lines is defined
