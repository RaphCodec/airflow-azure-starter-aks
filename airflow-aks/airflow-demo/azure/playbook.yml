---
- name: Deploy Airflow on Azure AKS
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Create Resource Group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        location: "{{ location }}"
        tags: "{{ tags }}"
        state: present
      register: rg_result

    - name: Display Resource Group creation status
      debug:
        msg: |
          Resource Group Created Successfully!
          Name: {{ resource_group }}
          Location: {{ location }}

    - name: Check if Azure Container Registry exists
      azure.azcollection.azure_rm_containerregistry_info:
        name: "{{ acr_name }}"
        resource_group: "{{ resource_group }}"
      register: acr_check
      ignore_errors: true

    - name: Create Azure Container Registry
      azure.azcollection.azure_rm_containerregistry:
        name: "{{ acr_name }}"
        resource_group: "{{ resource_group }}"
        location: "{{ location }}"
        sku: Basic
        admin_user_enabled: true
        tags: "{{ tags }}"
        state: present
      register: acr_result
      when: acr_check.registries | length == 0

    - name: Display ACR creation status
      debug:
        msg: |
          Azure Container Registry Status:
          {% if acr_check.registries | length > 0 %}
          ACR already exists - skipping creation
          {% else %}
          ACR Created Successfully!
          {% endif %}
          ACR Name: {{ acr_name }}
          Resource Group: {{ resource_group }}
          Location: {{ location }}
          SKU: Basic
          
          Verify with:
          az acr show --name {{ acr_name }} --resource-group {{ resource_group }}

    - name: Create Virtual Network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}"
        name: "{{ vnet_name }}"
        address_prefixes_cidr:
          - "10.0.0.0/16"
        tags: "{{ tags }}"
        state: present
      register: vnet_result

    - name: Create AKS subnet
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ resource_group }}"
        virtual_network_name: "{{ vnet_name }}"
        name: "{{ subnet_name }}"
        address_prefix_cidr: "10.0.1.0/24"
        state: present
      register: subnet_result

    - name: Create a managed Azure Container Services (AKS) cluster
      azure.azcollection.azure_rm_aks:
        name: "{{ cluster_name }}"
        location: "{{ location }}"
        resource_group: "{{ resource_group }}"
        dns_prefix: "{{ cluster_name }}"
        kubernetes_version: "{{ kubernetes_version }}"
        linux_profile:
          admin_username: "{{ admin_username }}"
          ssh_key: "{{ ssh_key }}"
        agent_pool_profiles:
          - name: "{{ node_pool.name }}"
            count: "{{ node_pool.node_count }}"
            vm_size: "{{ node_pool.vm_size }}"
            mode: System
        tags: "{{ tags }}"
        state: present
      register: aks_cluster

    - name: Display AKS cluster information
      debug:
        msg: |
          AKS Cluster Created Successfully!
          Cluster Name: {{ aks_cluster.name }}
          FQDN: {{ aks_cluster.fqdn }}
          Kubernetes Version: {{ aks_cluster.kubernetes_version }}
          
          To connect to the cluster, run:
          az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }}
          
          Then verify with:
          kubectl get nodes

    - name: Set images to import
      set_fact:
        images_to_import:
          - { source: "docker.io/apache/airflow:airflow-pgbouncer-2025.03.05-1.23.1", image: "airflow-pgbouncer:2025.03.05-1.23.1" }
          - { source: "docker.io/apache/airflow:airflow-pgbouncer-exporter-2025.03.05-0.18.0", image: "airflow-pgbouncer-exporter:2025.03.05-0.18.0" }
          - { source: "docker.io/bitnami/postgresql:16.1.0-debian-11-r15", image: "postgresql:16.1.0-debian-11-r15" }
          - { source: "quay.io/prometheus/statsd-exporter:v0.28.0", image: "statsd-exporter:v0.28.0" }
          - { source: "docker.io/apache/airflow:3.1.1", image: "airflow:3.1.1" }

    - name: Show target ACR info
      debug:
        msg: "Importing {{ images_to_import | length }} images into ACR '{{ acr_name }}' in RG '{{ resource_group }}' (region {{ location }})"

    - name: Import image if missing (check then import)
      shell: |
        set -euo pipefail
        REPO="{{ (item.image.split(':'))[0] }}"
        TAG="{{ (item.image.split(':'))[1] }}"
        if az acr repository show-tags -n {{ acr_name }} --repository "$REPO" -o tsv 2>/dev/null | grep -qx "$TAG"; then
          echo "exists"
        else
          az acr import --name {{ acr_name }} --source {{ item.source }} --image {{ item.image }}
          echo "imported"
        fi
      args:
        executable: /bin/bash
      register: import_result
      changed_when: "'imported' in import_result.stdout"
      failed_when: import_result.rc != 0 and ('exists' not in import_result.stdout)
      loop: "{{ images_to_import }}"
      loop_control:
        label: "{{ item.image }}"

    - name: Image import summary
      debug:
        msg: >-
          ACR image import completed. 
          Total images processed: {{ images_to_import | length }}
          Newly imported: {{ (import_result.results | selectattr('changed', 'equalto', true) | list | length) }}
          Already existed: {{ (import_result.results | rejectattr('changed', 'equalto', true) | list | length) }}

    - name: Display final deployment summary
      debug:
        msg: |
          ========================================
          Azure Infrastructure Deployment Complete!
          ========================================
          
          Resource Group: {{ resource_group }}
          Location: {{ location }}
          
          ACR Name: {{ acr_name }}
          ACR Login Server: {{ acr_name }}.azurecr.io
          
          AKS Cluster: {{ cluster_name }}
          Kubernetes Version: {{ kubernetes_version }}
          Node Count: {{ node_pool.node_count }}
          VM Size: {{ node_pool.vm_size }}
          
          Next Steps:
          1. Get AKS credentials:
             az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }}
          
          2. Verify cluster access:
             kubectl get nodes
          
          3. Login to ACR and push images:
             az acr login --name {{ acr_name }}
          
          4. Run the Airflow installation script:
             cd airlfow-helm && ./install-airflow.sh

