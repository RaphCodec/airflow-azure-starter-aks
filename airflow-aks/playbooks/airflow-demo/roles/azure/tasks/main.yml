---
- name: Create Resource Group
  azure.azcollection.azure_rm_resourcegroup:
    name: "{{ resource_group }}"
    location: "{{ location }}"
    state: present
  register: rg_creation

- name: Display Resource Group creation status
  debug:
    msg: |
      Resource Group Creation Initiated!
      Resource Group Name: {{ resource_group }}
      Verify creation with:
      az group show --name {{ resource_group }}

- name: Show resource group details with Azure CLI
  ansible.builtin.shell: az group show --name {{ resource_group }}
  register: rg_details

- name: Print resource group details
  debug:
    var: rg_details.stdout

- name: Check if ACR exists
  ansible.builtin.shell: az acr show --name {{ acr_name }} --resource-group {{ resource_group }}
  register: acr_exists
  ignore_errors: true

- name: Create Azure Container Registry using Azure CLI
  ansible.builtin.shell: |
    if [ "{{ acr_exists.rc }}" -ne 0 ]; then
      az acr create --name {{ acr_name }} \
        --resource-group {{ resource_group }} \
        --location {{ location }} \
        --sku Basic \
        --admin-enabled true
    else
      echo "ACR {{ acr_name }} already exists."
    fi
  register: acr_cli_result

- name: Print ACR creation result
  debug:
    var: acr_cli_result.stdout

- name: Create AKS subnet (if it doesn't exist)
  azure.azcollection.azure_rm_subnet:
    resource_group: "{{ resource_group }}"
    virtual_network_name: "{{ vnet_name }}"
    name: "{{ subnet_name }}"
    address_prefix_cidr: "10.0.1.0/24"
    state: present

- name: Create AKS cluster using Azure CLI
  ansible.builtin.shell: |
    az aks show --resource-group {{ resource_group }} --name {{ cluster_name }} || \
    az aks create --resource-group {{ resource_group }} \
      --name {{ cluster_name }} \
      --node-count {{ node_pool.node_count }} \
      --node-vm-size {{ node_pool.vm_size }} \
      --location {{ location }} \
      --kubernetes-version {{ kubernetes_version }} \
      --admin-username {{ admin_username }} \
      --ssh-key-value "{{ ssh_key }}" \
      --tags '{{ tags | to_json }}'
  register: aks_cli_result

- name: Print AKS creation result
  debug:
    var: aks_cli_result.stdout

- name: Display AKS cluster information
  debug:
    msg: |
      AKS Cluster Created Successfully!
      Cluster Name: {{ cluster_name }}
      Kubernetes Version: {{ kubernetes_version }}

      To connect to the cluster, run:
      az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }}

      Then verify with:
      kubectl get nodes

- name: Get AKS cluster credentials
  ansible.builtin.shell: az aks get-credentials --resource-group {{ resource_group }} --name {{ cluster_name }} --overwrite-existing
  register: get_credentials_result

- name: Attach ACR to AKS cluster
  ansible.builtin.shell: |
    az aks update -n {{ cluster_name }} -g {{ resource_group }} --attach-acr {{ acr_name }}
  register: attach_acr_result

