images:
  airflow:
    repository: $ACR_REGISTRY.azurecr.io/airflow-custom
    tag: 2025.11.09-3.1.2
    # Specifying digest takes precedence over tag.
    digest: ~
    pullPolicy: IfNotPresent
  # To avoid images with user code, you can turn this to 'true' and
  # all the 'run-airflow-migrations' and 'wait-for-airflow-migrations' containers/jobs
  # will use the images from 'defaultAirflowRepository:defaultAirflowTag' values
  # to run and wait for DB migrations .
  # Set to false to use custom image or image > 3.0.2 (default for helm chart 1.18.0) for migrations
  useDefaultImageForMigration: false
  # timeout (in seconds) for airflow-migrations to complete
  migrationsWaitTimeout: 90
  pod_template:
    # Note that `images.pod_template.repository` and `images.pod_template.tag` parameters
    # can be overridden in `config.kubernetes` section. So for these parameters to have effect
    # `config.kubernetes.worker_container_repository` and `config.kubernetes.worker_container_tag`
    # must be not set .
    repository: $ACR_REGISTRY.azurecr.io/airflow-custom
    tag: 2025.11.09-3.1.2
    pullPolicy: IfNotPresent
  flower:
    repository: $ACR_REGISTRY.azurecr.io/airflow-custom
    tag: 2025.11.09-3.1.2
    pullPolicy: IfNotPresent
  statsd:
    repository: $ACR_REGISTRY.azurecr.io/statsd-exporter
    tag: v0.28.0
    pullPolicy: IfNotPresent
  pgbouncer:
    repository: $ACR_REGISTRY.azurecr.io/airflow
    tag: airflow-pgbouncer-2025.03.05-1.23.1
    pullPolicy: IfNotPresent
  pgbouncerExporter:
    repository: $ACR_REGISTRY.azurecr.io/airflow
    tag: airflow-pgbouncer-exporter-2025.03.05-0.18.0
    pullPolicy: IfNotPresent
  # gitSync:
  #   repository: $ACR_REGISTRY.azurecr.io/git-sync
  #   tag: v4.3.0
  #   pullPolicy: IfNotPresent


# Airflow executor
executor: "CeleryExecutor"

# Environment variables for all airflow containers
env:
  - name: ENVIRONMENT
    value: dev

extraEnv: |
  - name: AIRFLOW__CORE__DEFAULT_TIMEZONE
    value: 'America/New_York'
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: 'true'
  - name: RATELIMIT_STORAGE_URI
    valueFrom:
      secretKeyRef:
        name: airflow-redis-connection
        key: connection

# Configuration for postgresql subchart
# Disabled - Using Azure Database for PostgreSQL Flexible Server instead
postgresql:
  enabled: false

# Enable pgbouncer for connection pooling
pgbouncer:
  enabled: true

# Redis Configuration - Using Azure Cache for Redis
redis:
  enabled: false  # Disable internal Redis since we're using Azure Cache for Redis

# External Database and Redis Configuration
# Connection strings will be pulled from Kubernetes secrets created by External Secrets Operator
data:
  # PostgreSQL metadata connection from external secret
  metadataSecretName: airflow-postgres-connection
  
  # Broker URL from external Redis secret
  brokerUrlSecretName: airflow-redis-connection
  
  # Result Backend from external Redis secret  
  resultBackendSecretName: airflow-redis-connection


logs:
  persistence:
    enabled: true
    existingClaim: pvc-airflow-logs
    storageClassName: azureblob-fuse-premium

# We disable the log groomer sidecar because we use Azure Blob Storage for logs, with lifecyle policy set.
triggerer:
  logGroomerSidecar:
    enabled: false

scheduler:
  logGroomerSidecar:
    enabled: false

workers:
  logGroomerSidecar:
    enabled: false

# API Server Configuration
apiServer:
  # Increase startup probe timeout
  startupProbe:
    timeoutSeconds: 5
    failureThreshold: 20
    periodSeconds: 10

