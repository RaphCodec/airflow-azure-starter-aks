---
- name: Delete test VM and associated resources
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - vars.yml
  tasks:
    - name: Delete VM
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}"
        name: "{{ vm_name }}"
        state: absent

    - name: Delete NIC
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ resource_group }}"
        name: "{{ vm_name }}-nic"
        state: absent

    - name: Delete public IP
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}"
        name: "{{ vm_name }}-pip"
        state: absent